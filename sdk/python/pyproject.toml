[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-observability"
version = "0.2.0"
description = "Python SDK for sending logs, traces, and metrics to Vigil."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "M-A-D-A-R-A", email = "andoriyanishant@gmail.com" }
]
license = "MIT"
keywords = ["vigil", "observability", "logs", "traces", "metrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/M-A-D-A-R-A/Vigil"
Repository = "https://github.com/M-A-D-A-R-A/Vigil"

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vigil_sdk = ["py.typed"]
